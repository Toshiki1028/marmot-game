<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふれあいまーもっと</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>
<body>
    <main id="game-screen" aria-label="ふれあいまーもっと 戦闘画面">
        <img id="cpu" src="assets/characters/cpu/1_Normal/stand/Stand_enemy.png" alt="CPUのまーもっと">
        <div id="cpu-hit-mark" aria-hidden="true">HIT!</div>
        <div id="player-hit-mark" aria-hidden="true">HIT!</div>
        <div id="roar-warning" role="status" aria-live="assertive" hidden>WARNING!</div>
        <div id="first-hit-label" role="status" aria-live="polite" hidden>FIRST HIT!</div>
        <img id="carrot" src="assets/carrots/リアルにんじん.png" alt="にんじん">
        <img id="player" src="assets/characters/player/stand/Stand_1P.png" alt="プレイヤーのまーもっと">

        <div id="battle-ui">
            <div class="gauge-group player-gauges" aria-label="プレイヤーのゲージ">
                <div class="gauge-row">
                    <img class="gauge-icon" src="assets/mark/マーク_スタミナ.png" alt="" aria-hidden="true">
                    <div class="gauge-track gauge stamina" aria-label="スタミナ"><div class="gauge-fill"></div></div>
                </div>
                <div class="gauge-row">
                    <img class="gauge-icon" src="assets/mark/マーク_咆哮.png" alt="" aria-hidden="true">
                    <div class="gauge-track gauge roar" aria-label="咆哮"><div class="gauge-fill"></div></div>
                </div>
            </div>
            <div class="gauge-group cpu-gauges" aria-label="CPUのゲージ">
                <div class="gauge-row">
                    <img class="gauge-icon" src="assets/mark/マーク_スタミナ.png" alt="" aria-hidden="true">
                    <div class="gauge-track gauge stamina" aria-label="スタミナ"><div class="gauge-fill"></div></div>
                </div>
                <div class="gauge-row">
                    <img class="gauge-icon" src="assets/mark/マーク_咆哮.png" alt="" aria-hidden="true">
                    <div class="gauge-track gauge roar" aria-label="咆哮"><div class="gauge-fill"></div></div>
                </div>
            </div>
            <div id="battle-center">
                <div id="stage-logo"><img id="stage-label" src="assets/stage/STAGE_1.png" alt="STAGE 1"></div>
                <div id="battle-timer" aria-label="残り時間 100">100</div>
            </div>
            <div id="carrot-gauge" class="gauge-row" aria-label="にんじん争奪ゲージ">
                <img class="gauge-icon" src="assets/mark/マーク_にんじん.png" alt="" aria-hidden="true">
                <div class="gauge-track gauge carrot-gauge-track">
                    <div class="carrot-gauge-player"></div>
                    <div class="carrot-gauge-cpu"></div>
                    <div class="carrot-gauge-center"></div>
                </div>
            </div>
        </div>
        <div id="struggle-ui" aria-live="polite" hidden>
            <div class="struggle-title">にんじん争奪！</div>
            <div class="struggle-mouse" aria-label="ホイールを上と下に交互に操作"><span>上</span><span>下</span></div>
            <div class="struggle-instruction" id="struggle-instruction">ホイール上・下 または J / K を交互に！</div>
            <div id="struggle-time" class="struggle-time">3</div>
            <div class="struggle-scores"><span>1P GOOD <strong id="struggle-player-score">0</strong></span><span><span id="struggle-opponent-label">CPU</span> GOOD <strong id="struggle-cpu-score">0</strong></span></div>
            <div id="struggle-feedback" class="struggle-feedback" aria-live="assertive"></div>
            <div id="struggle-2p-feedback" class="struggle-feedback" aria-live="assertive" hidden></div>
        </div>
        <div id="finish-label" aria-live="assertive" hidden>FINISH</div>
        <div id="result-label" aria-live="assertive" hidden></div>
        <div id="start-label" role="status" aria-live="assertive" hidden><img id="start-image" alt=""></div>
        <div id="title-screen" hidden>
            <h1>ふれあいまーもっと</h1>
            <p id="title-message">CPU戦 3ステージ連戦</p>
            <button id="start-button" type="button">はじめる</button>
            <button id="two-player-button" type="button">2人で遊ぶ</button>
            <button id="records-button" type="button">レコード</button>
        </div>
        <section id="two-player-help" class="record-screen" hidden aria-labelledby="two-player-heading">
            <h2 id="two-player-heading">2人で遊ぶ</h2>
            <p>1P：マウスでパンチ・回避・座り</p>
            <p>2P：D / F パンチ　J / K 回避　Space 座り</p>
            <p>2P：D＋Fを長押しで咆哮（ゲージ100%）</p>
            <p>にんじん争奪中は1Pがホイール上・下、2PがJ / Kを交互に入力</p>
            <button id="two-player-start" type="button">対戦開始</button>
            <button id="two-player-back" type="button">タイトルへ</button>
        </section>
        <section id="score-screen" class="record-screen" hidden aria-labelledby="score-heading">
            <h2 id="score-heading"></h2>
            <div id="score-details"></div>
            <button id="score-continue" type="button">つづける</button>
        </section>
        <section id="entry-screen" class="record-screen" hidden aria-labelledby="entry-heading">
            <h2 id="entry-heading">3連勝クリア！</h2>
            <p id="total-score"></p>
            <form id="record-form">
                <label for="record-name">プレイヤー名（12文字まで）</label>
                <input id="record-name" maxlength="12" autocomplete="nickname" placeholder="PLAYER">
                <button type="submit">登録</button>
                <p id="record-error" role="alert"></p>
            </form>
        </section>
        <section id="ranking-screen" class="record-screen" hidden aria-labelledby="ranking-heading">
            <h2 id="ranking-heading">ランキング TOP 10</h2>
            <div id="ranking-list"></div>
            <button id="ranking-back" type="button">タイトルへ</button>
        </section>
    </main>
</body>
</html>
